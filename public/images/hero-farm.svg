<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Sky -->
  <rect width="800" height="600" fill="#E8F5E9"/>
  <rect width="800" height="300" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="650" cy="120" r="60" fill="#FDE68A" opacity="0.8"/>
  <circle cx="650" cy="120" r="45" fill="#FBBF24" opacity="0.5"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="100" rx="80" ry="30" fill="white" opacity="0.6"/>
  <ellipse cx="250" cy="90" rx="60" ry="25" fill="white" opacity="0.5"/>
  <ellipse cx="500" cy="140" rx="70" ry="25" fill="white" opacity="0.4"/>
  <!-- Hills -->
  <path d="M0 350 Q200 280 400 320 Q600 360 800 300 L800 600 L0 600Z" fill="#66BB6A" opacity="0.6"/>
  <path d="M0 400 Q150 350 350 380 Q550 410 800 360 L800 600 L0 600Z" fill="#43A047" opacity="0.7"/>
  <path d="M0 450 Q200 410 400 440 Q600 470 800 430 L800 600 L0 600Z" fill="#2E7D32" opacity="0.8"/>
  <!-- Fence -->
  <rect x="100" y="400" width="4" height="50" fill="#5D4037"/>
  <rect x="160" y="400" width="4" height="50" fill="#5D4037"/>
  <rect x="220" y="400" width="4" height="50" fill="#5D4037"/>
  <rect x="100" y="410" width="124" height="3" fill="#5D4037"/>
  <rect x="100" y="430" width="124" height="3" fill="#5D4037"/>
  <!-- Tractor silhouette -->
  <rect x="550" y="380" width="60" height="35" rx="5" fill="#1B5E20" opacity="0.7"/>
  <rect x="530" y="395" width="25" height="20" rx="3" fill="#1B5E20" opacity="0.7"/>
  <circle cx="545" cy="420" r="12" fill="#1B5E20" opacity="0.8"/>
  <circle cx="590" cy="420" r="18" fill="#1B5E20" opacity="0.8"/>
  <!-- Cattle -->
  <ellipse cx="300" cy="450" rx="20" ry="12" fill="#4E342E" opacity="0.7"/>
  <circle cx="285" cy="443" r="7" fill="#4E342E" opacity="0.7"/>
  <ellipse cx="400" cy="470" rx="18" ry="10" fill="#3E2723" opacity="0.6"/>
  <circle cx="385" cy="463" r="6" fill="#3E2723" opacity="0.6"/>
  <!-- Wheat -->
  <line x1="680" y1="450" x2="680" y2="380" stroke="#F9A825" stroke-width="2"/>
  <ellipse cx="680" cy="375" rx="4" ry="8" fill="#F9A825"/>
  <line x1="700" y1="455" x2="700" y2="390" stroke="#F9A825" stroke-width="2"/>
  <ellipse cx="700" cy="385" rx="4" ry="8" fill="#F9A825"/>
  <line x1="720" y1="450" x2="720" y2="385" stroke="#F9A825" stroke-width="2"/>
  <ellipse cx="720" cy="380" rx="4" ry="8" fill="#F9A825"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
  </defs>
</svg>
