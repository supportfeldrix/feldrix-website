<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" fill="none">
  <rect width="300" height="150" fill="#F0FDF4"/>
  <!-- Calendar -->
  <rect x="60" y="30" width="180" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="30" width="180" height="25" rx="12" fill="#16A34A" opacity="0.9"/>
  <rect x="60" y="43" width="180" height="12" fill="#16A34A" opacity="0.9"/>
  <!-- Calendar dots -->
  <circle cx="90" cy="42" r="3" fill="white" opacity="0.6"/>
  <circle cx="120" cy="42" r="3" fill="white" opacity="0.6"/>
  <circle cx="150" cy="42" r="3" fill="white" opacity="0.6"/>
  <!-- Grid lines -->
  <line x1="60" y1="75" x2="240" y2="75" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="60" y1="100" x2="240" y2="100" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="105" y1="55" x2="105" y2="130" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="150" y1="55" x2="150" y2="130" stroke="#F1F5F9" stroke-width="1"/>
  <line x1="195" y1="55" x2="195" y2="130" stroke="#F1F5F9" stroke-width="1"/>
  <!-- Highlighted day -->
  <rect x="152" y="77" width="40" height="20" rx="4" fill="#16A34A" opacity="0.15"/>
  <circle cx="172" cy="87" r="3" fill="#16A34A" opacity="0.6"/>
  <!-- Check marks -->
  <circle cx="82" cy="65" r="4" fill="#22C55E" opacity="0.5"/>
  <circle cx="127" cy="87" r="4" fill="#3B82F6" opacity="0.5"/>
  <circle cx="217" cy="112" r="4" fill="#F59E0B" opacity="0.5"/>
</svg>
