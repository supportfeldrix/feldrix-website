<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none">
  <rect width="900" height="560" fill="#FFFFFF"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="160" height="560" fill="#FAFAFA"/>
  <rect x="159" y="0" width="1" height="560" fill="#F1F5F9"/>
  
  <!-- Logo area -->
  <rect x="20" y="20" width="28" height="28" rx="8" fill="#16A34A"/>
  <text x="28" y="40" font-family="Arial" font-size="14" fill="white" font-weight="bold" text-anchor="middle">F</text>
  <text x="60" y="39" font-family="Arial" font-size="11" fill="#1E293B" font-weight="bold">FELDRIX</text>
  
  <!-- Active nav item -->
  <rect x="16" y="70" width="128" height="34" rx="8" fill="#16A34A"/>
  <rect x="28" y="80" width="14" height="14" rx="4" fill="rgba(255,255,255,0.4)"/>
  <text x="52" y="91" font-family="Arial" font-size="10" fill="white" font-weight="600">Dashboard</text>
  
  <!-- Nav items -->
  <rect x="28" y="118" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="129" font-family="Arial" font-size="10" fill="#64748B">Livestock</text>
  <rect x="28" y="148" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="159" font-family="Arial" font-size="10" fill="#64748B">Crops</text>
  <rect x="28" y="178" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="189" font-family="Arial" font-size="10" fill="#64748B">Machinery</text>
  <rect x="28" y="208" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="219" font-family="Arial" font-size="10" fill="#64748B">Planner</text>
  <rect x="28" y="238" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="249" font-family="Arial" font-size="10" fill="#64748B">Finance</text>
  <rect x="28" y="268" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="279" font-family="Arial" font-size="10" fill="#64748B">Reports</text>
  <rect x="28" y="298" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="309" font-family="Arial" font-size="10" fill="#64748B">AI Assistant</text>
  <rect x="28" y="328" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="339" font-family="Arial" font-size="10" fill="#64748B">Weather</text>
  <rect x="28" y="358" width="14" height="14" rx="4" fill="#E2E8F0"/>
  <text x="52" y="369" font-family="Arial" font-size="10" fill="#64748B">Settings</text>
  
  <!-- Main Content Area -->
  <!-- Welcome -->
  <text x="185" y="45" font-family="Arial" font-size="15" fill="#1E293B" font-weight="bold">Welcome back, Tienie! 👋</text>
  <text x="185" y="65" font-family="Arial" font-size="11" fill="#64748B">Here's what's happening on your farm today.</text>
  
  <!-- Stat Cards Row -->
  <!-- Livestock -->
  <rect x="185" y="85" width="160" height="75" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="200" y="107" font-family="Arial" font-size="9" fill="#64748B">🐄 Livestock</text>
  <text x="200" y="135" font-family="Arial" font-size="22" fill="#16A34A" font-weight="bold">124</text>
  <text x="200" y="150" font-family="Arial" font-size="8" fill="#94A3B8">Total Animals</text>
  
  <!-- Crops -->
  <rect x="355" y="85" width="160" height="75" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="370" y="107" font-family="Arial" font-size="9" fill="#64748B">🌱 Crops</text>
  <text x="370" y="135" font-family="Arial" font-size="22" fill="#F59E0B" font-weight="bold">8</text>
  <text x="370" y="150" font-family="Arial" font-size="8" fill="#94A3B8">Active Crops</text>
  
  <!-- Tasks -->
  <rect x="525" y="85" width="160" height="75" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="540" y="107" font-family="Arial" font-size="9" fill="#64748B">📋 Tasks</text>
  <text x="540" y="135" font-family="Arial" font-size="22" fill="#3B82F6" font-weight="bold">12</text>
  <text x="540" y="150" font-family="Arial" font-size="8" fill="#94A3B8">Due Today</text>
  
  <!-- Profit -->
  <rect x="695" y="85" width="180" height="75" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="710" y="107" font-family="Arial" font-size="9" fill="#64748B">💰 Profit (MTD)</text>
  <text x="710" y="135" font-family="Arial" font-size="22" fill="#8B5CF6" font-weight="bold">R 24,750</text>
  <text x="710" y="150" font-family="Arial" font-size="8" fill="#94A3B8">+15% vs last month</text>
  
  <!-- Farm Health Score -->
  <rect x="185" y="175" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="205" y="200" font-family="Arial" font-size="12" fill="#1E293B" font-weight="bold">Farm Health Score</text>
  <!-- Score circle -->
  <circle cx="260" cy="270" r="38" fill="none" stroke="#E2E8F0" stroke-width="4"/>
  <circle cx="260" cy="270" r="38" fill="none" stroke="#16A34A" stroke-width="4" stroke-dasharray="200" stroke-dashoffset="30" stroke-linecap="round"/>
  <text x="260" y="278" font-family="Arial" font-size="22" fill="#16A34A" font-weight="bold" text-anchor="middle">85</text>
  <!-- Labels -->
  <text x="320" y="240" font-family="Arial" font-size="9" fill="#64748B">Livestock</text>
  <text x="420" y="240" font-family="Arial" font-size="9" fill="#16A34A">87%</text>
  <text x="320" y="260" font-family="Arial" font-size="9" fill="#64748B">Crops</text>
  <text x="420" y="260" font-family="Arial" font-size="9" fill="#F59E0B">78%</text>
  <text x="320" y="280" font-family="Arial" font-size="9" fill="#64748B">Machinery</text>
  <text x="420" y="280" font-family="Arial" font-size="9" fill="#3B82F6">92%</text>
  <text x="320" y="300" font-family="Arial" font-size="9" fill="#64748B">Finance</text>
  <text x="420" y="300" font-family="Arial" font-size="9" fill="#8B5CF6">84%</text>
  
  <!-- Upcoming Tasks -->
  <rect x="510" y="175" width="365" height="150" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="530" y="200" font-family="Arial" font-size="12" fill="#1E293B" font-weight="bold">Upcoming Tasks</text>
  <text x="810" y="200" font-family="Arial" font-size="9" fill="#16A34A" font-weight="600">View all</text>
  <text x="530" y="228" font-family="Arial" font-size="10" fill="#64748B">● Vaccinate herd</text>
  <text x="810" y="228" font-family="Arial" font-size="9" fill="#94A3B8">Today</text>
  <rect x="530" y="235" width="330" height="1" fill="#F8FAFC"/>
  <text x="530" y="253" font-family="Arial" font-size="10" fill="#64748B">● Irrigation check</text>
  <text x="810" y="253" font-family="Arial" font-size="9" fill="#94A3B8">Tomorrow</text>
  <rect x="530" y="260" width="330" height="1" fill="#F8FAFC"/>
  <text x="530" y="278" font-family="Arial" font-size="10" fill="#64748B">● Tractor service</text>
  <text x="810" y="278" font-family="Arial" font-size="9" fill="#94A3B8">2 days</text>
  <rect x="530" y="285" width="330" height="1" fill="#F8FAFC"/>
  <text x="530" y="303" font-family="Arial" font-size="10" fill="#64748B">● Monthly financial review</text>
  <text x="810" y="303" font-family="Arial" font-size="9" fill="#94A3B8">5 days</text>
  
  <!-- Weather -->
  <rect x="185" y="340" width="380" height="110" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="205" y="368" font-family="Arial" font-size="12" fill="#1E293B" font-weight="bold">Weather</text>
  <text x="215" y="400" font-family="Arial" font-size="20" fill="#1E293B" font-weight="bold">☀️ 24°C</text>
  <text x="310" y="398" font-family="Arial" font-size="10" fill="#64748B">Partly Cloudy</text>
  <text x="215" y="430" font-family="Arial" font-size="9" fill="#64748B">Tue 26°</text>
  <text x="275" y="430" font-family="Arial" font-size="9" fill="#64748B">Wed 27°</text>
  <text x="335" y="430" font-family="Arial" font-size="9" fill="#64748B">Thu 25°</text>
  <text x="395" y="430" font-family="Arial" font-size="9" fill="#64748B">Fri 26°</text>
  
  <!-- Recent Activity -->
  <rect x="580" y="340" width="295" height="110" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
  <text x="600" y="368" font-family="Arial" font-size="12" fill="#1E293B" font-weight="bold">Recent Activity</text>
  <circle cx="610" cy="395" r="4" fill="#EF4444"/>
  <text x="620" y="399" font-family="Arial" font-size="10" fill="#64748B">New calf born</text>
  <text x="810" y="399" font-family="Arial" font-size="8" fill="#94A3B8">3 hours ago</text>
  <circle cx="610" cy="420" r="4" fill="#EF4444"/>
  <text x="620" y="424" font-family="Arial" font-size="10" fill="#64748B">Irrigation completed</text>
  <text x="810" y="424" font-family="Arial" font-size="8" fill="#94A3B8">4 hours ago</text>
</svg>
